---
when:
  - event: [pull_request, tag]
  - event: [push, manual]
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

variables:
  - &test_base
    commands:
      - apt-get update > /dev/null 2>&1 && apt-get install -yq dbus dbus-x11 libasound2 libgbm1 libgtk-3-0 libnss3 xvfb wget jq > /dev/null 2>&1
      - eval $$(dbus-launch --sh-syntax)
      - export DBUS_SYSTEM_BUS_ADDRESS=$$DBUS_SESSION_BUS_ADDRESS
      - xvfb-run -a npm run test:run

steps:
  - name: deps
    image: docker.io/library/node:26
    commands:
      - npm ci
      - npm run build:all

  - name: vscode-1.119.0
    image: docker.io/library/node:26
    depends_on: ["deps"]
    environment:
      VSCODE_TEST_VERSION: "1.119.0"
    !!merge <<: *test_base

  - name: vscode-stable
    image: docker.io/library/node:26
    depends_on: ["deps"]
    environment:
      VSCODE_TEST_VERSION: "stable"
    !!merge <<: *test_base

  - name: vscode-insiders
    image: docker.io/library/node:26
    depends_on: ["deps"]
    environment:
      VSCODE_TEST_VERSION: "insiders"
    !!merge <<: *test_base
